<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Document</title>
    <style>
        .error {
            color: red;
        }

        .success {
            color: blueviolet;
        }
    </style>




</head>
<body class="bg-success">
    <div class="container">
        <h1 class="text-center">Name Display</h1>
        <form action="" id="myForm" required>
            <input type="text" class="form-control mb-3" placeholder="Enter your name" id="userName">

            <input class="form-control mb-3" type="password" placeholder="Enter your password" id="userPassword">
            <input class="form-control mb-3" type="email" placeholder="Enter your email" id="userEmail">
        <button id="showButton" class="btn btn-dark" type="submit">Show Name</button>
        </form>
        <p id="message"></p>

    </div>

    <script src="scripts.js"></script>

</body>
</html>
